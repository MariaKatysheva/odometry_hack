# Параметры ноды tram_backup_odometry. Значения по умолчанию — выбранный вариант, откалиброванный офлайн.
tram_backup_odometry:
  ros__parameters:
    data_dir: ""              # пусто — карта и таблицы из share/tram_backup_odometry/data
    frame_id: map             # система координат положения (как у эталона /localization/kinematic_state)
    child_frame_id: base_link
    gnss_window: 20.0         # с — RTK-точки для начальной выставки (GNSS только для неё)
    gnss_max_dist: 30.0       # м — дальше от обеих линий: вне карты → относительная одометрия
    gnss_wait: 5.0            # с — ждать RTK; до выставки положение не публикуется, потом — относительная одометрия
    pair_tol: 0.005           # с — сообщения передней и задней тележки с таким расхождением stamp — одна пара
    pair_wait: 0.05           # с (по стенным часам) — сколько ждать вторую тележку, потом считаем по одной
    publish_on_cmd: true      # выдавать и на сообщения контроллера (прогноз по модели) — частота ≈ 30 Гц
    sigma_v_scale: 1.534      # калибровка неуверенности скорости (unc_check.py)
    kappa_sigma: 0.0062       # калибровка неуверенности пути (unc_check.py)
    sigma_cross: 1.0          # м — поперечная неуверенность в covariance (грубо; не калибровалась)
    sigma_z: 0.5              # м — неуверенность высоты в covariance (грубо; не калибровалась)
    stop_exit: 0.5            # с — обе тележки ровно 0 столько → стоим (выход из режима «обе проскальзывают»)
    slip_rollback: true       # неподтверждённый слип → путь за эпизод по колёсам
    slip_no_neutral: true     # не входить в «обе проскальзывают» при u = 0 (тормоз вне топика контроллера)
    slip_skip_u: [-8]         # и при этих ступенях: на −8 модель привода ненадёжна (разброс 0,68 м/с²)
    pathgraph_xy: true        # план (x, y) по Pathgraph своего направления: эталон жюри лежит на нём
    terminal: true            # пути конечной «Таллинская» за концом линии BA (OSM): среднее по веткам с их частотами
